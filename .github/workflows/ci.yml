name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the in-flight run instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # `make` targets resolve their interpreter from VIRTUAL_ENV first, so pointing
  # it at the venv below makes every target reuse the cached install.
  VIRTUAL_ENV: ${{ github.workspace }}/.venv

jobs:
  # Fast feedback: compile checks, shell parsing, and the publication gates.
  # Runs first so an obviously broken pipeline fails in ~2 minutes.
  gates:
    name: Lint + pipeline gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Restore FFmpeg apt package
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ffmpeg
          version: "1.0"

      - name: Create venv and install dependencies
        run: |
          uv venv --python "${{ env.PYTHON_VERSION }}" .venv
          uv pip install -r requirements-dev.txt

      - name: Compile-check load-bearing modules
        run: make lint

      - name: Parse pipeline shell scripts
        run: make lint-shell

      - name: Run generate/render/QA/portrait gates
        run: make test-gates

  # The rest of the suite. Split from `gates` so both run in parallel lanes
  # after the cache is warm, and a slow full run never delays gate feedback.
  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Restore FFmpeg apt package
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ffmpeg
          version: "1.0"

      # tests/qa probes the HyperFrames CLI through npx; caching the npm store
      # avoids a 30-90s cold fetch on every run.
      - name: Cache npm / npx store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Create venv and install dependencies
        run: |
          uv venv --python "${{ env.PYTHON_VERSION }}" .venv
          uv pip install -r requirements-dev.txt

      - name: Run full test suite
        run: make test
