name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      WANDB_MODE: "offline"
      OPENMONTAGE_CACHE_DIR: "/tmp/openmontage_cache"
      OPENMONTAGE_RENDERER: "ffmpeg"
      GENERATION_RETRY_DELAY_SECONDS: "0"
      PLATFORM_SCHEDULE_RETRY_DELAY_SECONDS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update -o Acquire::http::Timeout="10" && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Parse pipeline shell scripts
        run: make lint-shell

      - name: Run test suite
        run: make test

      - name: Run contract and cron regression tests
        run: make test-contracts test-cron
