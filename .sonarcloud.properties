# SonarCloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/automatic-analysis/

# Project Identifiers
sonar.projectKey=giauphan_OpenMontage
sonar.organization=giauphan
sonar.projectName=OpenMontage

# Source and Test directories
sonar.sources=lib,tools,scripts
sonar.tests=tests

# Source encoding
sonar.sourceEncoding=UTF-8

# Python version compatibility
sonar.python.version=3.10, 3.11

# File exclusions for non-code and media assets to prevent encoding errors
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.webp,**/*.avif,**/*.ttf,**/*.woff,**/*.woff2,node_modules/**,.cache/**,.venv/**,**/__pycache__/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,docs/**,skills/**,.agents/**,deploy/**,remotion-composer/**,*.md
sonar.test.inclusions=tests/**
sonar.cpd.exclusions=tests/**,artifacts/**,.agents/**,skills/**
