<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Engineering Architecture of Production AI Agents: Sandboxes, Memory, and Verification</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --accent: #38bdf8; --bg: #090d16; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
    .bg-fill { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, rgba(56,189,248,0.12) 0%, transparent 65%), linear-gradient(180deg, #090d16 0%, #0f172a 100%); }
    .clip { position: absolute; inset: 0; }
    .scene-inner { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 80px 140px; text-align: center; }
    .kicker { font-size: 24px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; padding: 8px 24px; border: 2px solid var(--accent); border-radius: 9999px; }
    .title { font-size: 56px; font-weight: 900; line-height: 1.15; color: #fff; max-width: 1400px; margin: 0 auto 28px; }
    .subtitle { font-size: 28px; line-height: 1.5; color: #94a3b8; max-width: 1200px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="360">
    <div class="bg-fill"></div>
    <audio id="narration" class="clip" data-start="0" data-duration="360" data-track-index="0" src="../assets/narration.mp3"></audio>
    <section id="scene-hero" class="clip" data-start="0" data-duration="360" data-track-index="1">
      <div class="scene-inner">
        <span class="kicker">SYSTEM ARCHITECTURE</span>
        <h1 class="title">Engineering Architecture of Production AI Agents: Sandboxes, Memory, and Verification</h1>
        <p class="subtitle">A technical deep-dive into multi-agent supervision, tool isolation, and deterministic verification.</p>
      </div>
    </section>
  </div>
</body>
</html>
