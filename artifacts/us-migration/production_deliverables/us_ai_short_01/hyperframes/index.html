<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Autonomous AI Coding Agents: Why Sandbox Tool Governance Matters</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --accent: #38bdf8; --bg: #090d16; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
    .bg-fill { position: absolute; inset: 0; background: radial-gradient(circle at 50% 20%, rgba(56,189,248,0.15) 0%, transparent 60%), linear-gradient(180deg, #090d16 0%, #0f172a 100%); }
    .clip { position: absolute; inset: 0; }
    .scene-inner { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 120px 80px 160px; text-align: center; }
    .kicker { font-size: 28px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-bottom: 32px; padding: 10px 28px; border: 2px solid var(--accent); border-radius: 9999px; }
    .title { font-size: 64px; font-weight: 900; line-height: 1.15; color: #fff; max-width: 920px; margin: 0 auto 36px; }
    .subtitle { font-size: 34px; line-height: 1.5; color: #94a3b8; max-width: 860px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="72">
    <div class="bg-fill"></div>
    <audio id="narration" class="clip" data-start="0" data-duration="72" data-track-index="0" src="../assets/narration.mp3"></audio>
    <section id="scene-hook" class="clip" data-start="0" data-duration="72" data-track-index="1">
      <div class="scene-inner">
        <span class="kicker">PRODUCTION AI</span>
        <h1 class="title">Autonomous AI Coding Agents: Why Sandbox Tool Governance Matters</h1>
        <p class="subtitle">Deterministic sandboxing, append-only audit ledgers, and supervisory control.</p>
      </div>
    </section>
  </div>
</body>
</html>
