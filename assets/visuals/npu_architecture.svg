<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a151b" />
      <stop offset="100%" stop-color="#050a0e" />
    </linearGradient>
    <linearGradient id="npuGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#058c69" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f2138" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="640" rx="28" fill="url(#bgGrad2)" stroke="#1a2e3b" stroke-width="2" />

  <!-- Diagram Title Header -->
  <text x="60" y="70" font-family="'BeVietnamPro',Inter,sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">KIẾN TRÚC PHẦN CỨNG NPU ĐỘC LẬP</text>
  <text x="60" y="98" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="600" fill="#06d6a0" letter-spacing="1">BỘ NHỚ ĐỒNG NHẤT TỐC ĐỘ CAO (UNIFIED MEMORY)</text>

  <!-- Left: Unified Memory Block -->
  <rect x="70" y="150" width="220" height="380" rx="18" fill="url(#memGrad)" stroke="#2b5380" stroke-width="2" />
  <text x="180" y="200" font-family="'BeVietnamPro',Inter,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">UNIFIED MEMORY</text>
  <text x="180" y="225" font-family="'BeVietnamPro',Inter,sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Băng thông cực đại</text>

  <g transform="translate(95, 260)">
    <rect width="170" height="48" rx="8" fill="#13273e" stroke="#3b82f6" stroke-width="1.5" />
    <text x="85" y="30" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">LLM Weights (VRAM)</text>
    
    <rect y="64" width="170" height="48" rx="8" fill="#13273e" stroke="#3b82f6" stroke-width="1.5" />
    <text x="85" y="94" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">KV Cache Buffer</text>
    
    <rect y="128" width="170" height="48" rx="8" fill="#13273e" stroke="#3b82f6" stroke-width="1.5" />
    <text x="85" y="158" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">Context Window</text>
  </g>

  <!-- High-Bandwidth Bus (Center arrows) -->
  <g stroke="#06d6a0" stroke-width="3" fill="none">
    <path d="M 290 280 L 370 280" stroke-dasharray="6,4" />
    <path d="M 290 340 L 370 340" stroke-dasharray="6,4" />
    <path d="M 290 400 L 370 400" stroke-dasharray="6,4" />
  </g>
  <rect x="305" y="325" width="50" height="30" rx="6" fill="#061d18" stroke="#06d6a0" stroke-width="1.5" />
  <text x="330" y="345" font-family="'BeVietnamPro',Inter,sans-serif" font-size="11" font-weight="800" fill="#06d6a0" text-anchor="middle">BUS</text>

  <!-- Right: NPU Core Accelerator -->
  <rect x="370" y="150" width="520" height="380" rx="18" fill="#091f1a" stroke="#06d6a0" stroke-width="2.5" />
  <text x="400" y="200" font-family="'BeVietnamPro',Inter,sans-serif" font-size="22" font-weight="900" fill="#06d6a0">NPU NEURAL ACCELERATOR</text>
  <text x="400" y="225" font-family="'BeVietnamPro',Inter,sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">Động cơ ma trận Tensor 45 TOPS nội bộ</text>

  <!-- Inner Processing Cores Grid -->
  <g transform="translate(400, 255)">
    <!-- Core 1 -->
    <rect width="130" height="90" rx="10" fill="#0d2e25" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="40" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">TENSOR CORE</text>
    <text x="65" y="65" font-family="'BeVietnamPro',Inter,sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Ma Trận 16-bit</text>

    <!-- Core 2 -->
    <rect x="150" width="130" height="90" rx="10" fill="#0d2e25" stroke="#10b981" stroke-width="1.5" />
    <text x="215" y="40" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">TENSOR CORE</text>
    <text x="215" y="65" font-family="'BeVietnamPro',Inter,sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">INT4 / INT8</text>

    <!-- Core 3 -->
    <rect x="300" width="155" height="90" rx="10" fill="#0d2e25" stroke="#10b981" stroke-width="1.5" />
    <text x="377" y="40" font-family="'BeVietnamPro',Inter,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">ATTENTION ENG</text>
    <text x="377" y="65" font-family="'BeVietnamPro',Inter,sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">FlashAttention</text>

    <!-- Bottom: Secure Enclave -->
    <rect y="115" width="460" height="110" rx="12" fill="#071914" stroke="#059669" stroke-width="2" />
    <circle cx="40" cy="170" r="18" fill="#06d6a0" filter="url(#glow2)" />
    <text x="40" y="176" font-family="'BeVietnamPro',Inter,sans-serif" font-size="16" font-weight="900" fill="#052e24" text-anchor="middle">✓</text>
    <text x="75" y="148" font-family="'BeVietnamPro',Inter,sans-serif" font-size="15" font-weight="800" fill="#ffffff">SECURE OFFLINE ENCLAVE</text>
    <text x="75" y="174" font-family="'BeVietnamPro',Inter,sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">Dữ liệu cá nhân xử lý 100% tại chỗ</text>
    <text x="75" y="196" font-family="'BeVietnamPro',Inter,sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Ngoại tuyến hoàn toàn • Không kết nối mạng ngoài</text>
  </g>
</svg>
