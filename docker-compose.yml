services:
  # Base worker for render / NewsNow pipeline / manual tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_worker
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      # Mount user's local Claude CLI login session (~/.claude.json / credentials)
      - ~/.claude.json:/root/.claude.json:ro
      - ~/.claude:/root/.claude
      - ~/.claude.json:/home/node/.claude.json:ro
      - ~/.claude:/home/node/.claude
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true

  # Daily publish scheduler (YouTube / Meta / NewsNow automated pipeline)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_scheduler
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.claude.json:/root/.claude.json:ro
      - ~/.claude:/root/.claude
      - ~/.claude.json:/home/node/.claude.json:ro
      - ~/.claude:/home/node/.claude
    command: >
      bash -c "
        apt-get update && apt-get install -y cron jq &&
        cp deploy/openmontage.cron /etc/cron.d/openmontage-cron &&
        chmod 0644 /etc/cron.d/openmontage-cron &&
        crontab /etc/cron.d/openmontage-cron &&
        cron -f
      "
    restart: unless-stopped
