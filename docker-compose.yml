services:
  # Base worker for render / NewsNow pipeline / manual tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_worker
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/root/.codex
      - ~/.codex:/home/node/.codex
      - ~/.openmontage:/root/.openmontage
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
    stdin_open: true
    tty: true

  # Daily publish scheduler (YouTube / Meta / NewsNow automated pipeline)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_scheduler
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/root/.codex
      - ~/.codex:/home/node/.codex
      - ~/.openmontage:/root/.openmontage
    command: >
      bash -c "
        mkdir -p /app/logs &&
        apt-get update && apt-get install -y cron jq &&
        cp deploy/openmontage.cron /etc/cron.d/openmontage-cron &&
        chmod 0644 /etc/cron.d/openmontage-cron &&
        crontab /etc/cron.d/openmontage-cron &&
        cron -f
      "
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
