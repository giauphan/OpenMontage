services:
  # Base worker for render / NewsNow pipeline / manual tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_worker
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/etc/codex_source:ro
      - ~/.openmontage:/root/.openmontage
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
      - CODEX_HOME=/root/.codex_pipeline
    command: ["tail", "-f", "/dev/null"]
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.75"
          memory: 4096M

  # Daily publish scheduler (YouTube / Meta / NewsNow automated pipeline)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_scheduler
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
      - CODEX_HOME=/root/.codex_pipeline
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/etc/codex_source:ro
      - ~/.openmontage:/root/.openmontage
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      bash -c "
        (command -v cron >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 || (apt-get update && apt-get install -y cron jq)) &&
        mkdir -p /app/logs &&
        crontab deploy/openmontage.cron &&
        cron -f
      "
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
    restart: unless-stopped
