services:
  # Base worker for render / NewsNow pipeline / manual tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_worker
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      # Mount user's local Claude CLI login session (~/.claude.json / credentials)
      - ~/.claude.json:/root/.claude.json:ro
      - ~/.claude:/root/.claude
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true

  # Daily publish scheduler (YouTube 01:00 UTC / Meta 01:30 UTC)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_scheduler
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./projects:/app/projects
      - ./config:/app/config
      - ./credentials:/app/credentials:ro
    command: >
      bash -c "
        apt-get update && apt-get install -y cron &&
        cp deploy/openmontage.cron /etc/cron.d/openmontage-cron &&
        chmod 0644 /etc/cron.d/openmontage-cron &&
        crontab /etc/cron.d/openmontage-cron &&
        cron -f
      "
    restart: unless-stopped
