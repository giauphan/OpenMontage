services:
  # Base worker for render / NewsNow pipeline / manual tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_worker
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/etc/codex_source:ro
      - ~/.openmontage:/root/.openmontage
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
      - CODEX_HOME=/root/.codex_pipeline
    stdin_open: true
    tty: true

  # Daily publish scheduler (YouTube / Meta / NewsNow automated pipeline)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmontage:latest
    container_name: openmontage_scheduler
    network_mode: "host"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - OPENMONTAGE_PYTHON=/usr/bin/python3
      - CODEX_HOME=/root/.codex_pipeline
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.codex:/etc/codex_source:ro
      - ~/.openmontage:/root/.openmontage
    command: >
      bash -c "
        bash /app/scripts/init_codex_profile.sh /etc/codex_source /root/.codex_pipeline &&
        mkdir -p /app/logs &&
        apt-get update && apt-get install -y cron jq &&
        crontab deploy/openmontage.cron &&
        cron -f
      "
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
