sonar.organization=giauphan
sonar.projectKey=giauphan_OpenMontage
sonar.projectName=OpenMontage

# Source code directories
sonar.sources=scripts,tools,lib,deploy,pipeline_defs,config,styles,templates
sonar.tests=tests

# Exclude generated artifacts, logs, renders, media assets, and dependencies
sonar.exclusions=projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,node_modules/**,**/__pycache__/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.ttf,**/*.woff,**/*.woff2

# Language specifics
sonar.python.version=3.11
