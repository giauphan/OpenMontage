sonar.projectKey=giauphan_OpenMontage
sonar.organization=giauphan

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=OpenMontage
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude tests (indexed separately under sonar.tests), markdown prompt skills, agent skill packages, vendor caches, and media assets
sonar.exclusions=tests/**,skills/**,.agents/**,**/skills/**,**/agents/**,node_modules/**,.cache/**,.venv/**,**/__pycache__/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.webp,**/*.ttf,**/*.woff,**/*.woff2,.github/**,remotion-composer/**,deploy/**,*.md
sonar.global.exclusions=skills/**,.agents/**,**/skills/**,**/agents/**,node_modules/**,.cache/**,.venv/**,**/__pycache__/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,.github/**,remotion-composer/**,deploy/**,*.md

# Language specifics
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/**,tests/**,artifacts/**,deploy/**,pipeline_defs/**,config/**,schemas/**,remotion-composer/**,.agents/**,skills/**
sonar.cpd.exclusions=tests/**,artifacts/**,.agents/**,skills/**
