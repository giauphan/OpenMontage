sonar.projectKey=giauphan_OpenMontage
sonar.organization=giauphan

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=OpenMontage
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=lib,tools,scripts
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude non-source files, vendor caches, and media assets
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.webp,**/*.avif,**/*.ttf,**/*.woff,**/*.woff2,node_modules/**,.cache/**,.venv/**,**/__pycache__/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,docs/**,skills/**,.agents/**,deploy/**,remotion-composer/**,*.md
sonar.global.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.webp,**/*.avif,**/*.ttf,**/*.woff,**/*.woff2,node_modules/**,.cache/**,.venv/**,**/__pycache__/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,docs/**,skills/**,.agents/**,deploy/**,remotion-composer/**,*.md

# Language specifics
sonar.python.version=3.10, 3.11
sonar.coverage.exclusions=scripts/**,tests/**,artifacts/**,deploy/**,pipeline_defs/**,config/**,schemas/**,remotion-composer/**,.agents/**,skills/**
sonar.cpd.exclusions=tests/**,artifacts/**,.agents/**,skills/**
