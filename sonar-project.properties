sonar.organization=giauphan
sonar.projectKey=giauphan_OpenMontage
sonar.projectName=OpenMontage

sonar.sources=lib,tools
sonar.tests=tests

# Exclude generated artifacts, logs, renders, media assets, scripts, dockerfiles, workflows, and skills
sonar.exclusions=scripts/**,.agents/**,skills/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,node_modules/**,**/__pycache__/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.mp4,**/*.mp3,**/*.wav,**/*.ttf,**/*.woff,**/*.woff2,Dockerfile*,*.dockerfile,.github/**,remotion-composer/**,deploy/**,config/**,schemas/**,*.md
sonar.global.exclusions=scripts/**,.agents/**,skills/**,projects/**,projects_news/**,data/**,logs/**,renders/**,assets/**,artifacts/**,node_modules/**,**/__pycache__/**,Dockerfile*,*.dockerfile,.github/**,remotion-composer/**,deploy/**,config/**,schemas/**,*.md

# Language specifics
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/**,tests/**,artifacts/**,deploy/**,pipeline_defs/**,config/**,schemas/**,remotion-composer/**,.agents/**,skills/**
sonar.cpd.exclusions=tests/**,artifacts/**,.agents/**,skills/**

