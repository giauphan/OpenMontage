<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>agent-pipeline-flow (16:9 Full Explainer) — HyperFrames Template</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1120;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      margin: 0 auto;
      background: #0b1120;
    }
    .bg-fill {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #0b1120 85%);
      z-index: 0;
    }
    .scene-clip {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .stage-card-horizontal {
      position: absolute;
      top: 80px;
      left: 120px;
      width: 1680px;
      height: 920px;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .diagram-viewport-horizontal {
      width: 100%;
      height: 820px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .diagram-viewport-horizontal svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .flow-step {
      opacity: 0;
      transform-origin: center center;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.45));
    }
    .flow-arrow {
      opacity: 0;
      transform-origin: top center;
    }
    .flow-header {
      opacity: 0;
    }
    .flow-cta-banner {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="70">
    <div class="bg-fill"></div>
    <audio id="narration" class="clip" data-start="0" data-duration="70" data-track-index="0" src="assets/narration.mp3"></audio>
    <audio id="bgm" class="clip" data-start="0" data-duration="70" data-track-index="1" src="assets/music-bg.mp3" data-volume="0.12" loop></audio>

    <main id="scenes-container"></main>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = window.gsap ? gsap.timeline({ paused: true }) : null;
    if (tl) {
      window.__timelines["main"] = tl;
      window.__hyperframes_timeline = tl;
    }

    window.__INIT_HYPERFRAMES_HORIZONTAL__ = function(data) {
      if (!window.gsap) return;
      const activeTl = tl || gsap.timeline({ paused: true });
      window.__timelines["main"] = activeTl;
      window.__hyperframes_timeline = activeTl;

      const totalDur = data.duration || 70.0;
      tl.to("#bgm", { volume: 0, duration: 1.5, ease: "power2.in" }, Math.max(0, totalDur - 1.5));

      const scenes = data.scenes || [];
      scenes.forEach((scene, idx) => {
        const secId = `scene-${scene.id || idx}`;
        const startS = scene.start_s || 0.0;
        const endS = scene.end_s || totalDur;
        const dur = Math.max(0.5, endS - startS);
        const isFinal = (idx === scenes.length - 1);

        tl.set(`#${secId}`, { opacity: 1, pointerEvents: "auto" }, startS);
        tl.fromTo(`#${secId} .stage-card-horizontal`, 
          { opacity: 0, scale: 0.98 }, 
          { opacity: 1, scale: 1.0, duration: 0.45, ease: "power2.out" }, 
          startS
        );

        const steps = scene.steps || [];
        const numSteps = steps.length;
        const holdTime = isFinal ? 5.0 : Math.min(4.0, Math.max(2.5, dur * 0.28));
        const usableSpan = Math.max(1.0, dur - holdTime);
        const stepInterval = (usableSpan - 0.2) / Math.max(1, numSteps - 1);

        tl.to(`#${secId} .flow-header`, { opacity: 1, duration: 0.35, ease: "power2.out" }, startS + 0.1);

        steps.forEach((step, sIdx) => {
          const relT = 0.2 + sIdx * stepInterval;
          const absT = startS + relT;
          tl.fromTo(`#${secId} #flow-step-${sIdx+1}`,
            { opacity: 0, y: 15 },
            { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" },
            absT
          );
        });

        if (!isFinal) {
          tl.to(`#${secId}`, { opacity: 0, duration: 0.25, ease: "power2.in" }, Math.max(0, endS - 0.25));
        }
      });
    };
  </script>
</body>
</html>
