<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>agent-pipeline-flow (9:16 Reels/Shorts) — HyperFrames Template</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b1120;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      margin: 0 auto;
      background: #0b1120;
    }
    .bg-fill {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #0b1120 85%);
      z-index: 0;
    }
    .scene-clip {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .stage-card {
      position: absolute;
      top: 190px;
      left: 45px;
      width: 990px;
      height: 1200px;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .diagram-viewport {
      width: 100%;
      height: 1100px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .diagram-viewport svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage-footer {
      position: absolute;
      bottom: 24px;
      left: 30px;
      right: 30px;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 65%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 2;
    }
    /* Voice-synchronized progressive reveal styling */
    .flow-step {
      opacity: 0;
      transform-origin: center center;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.45));
    }
    .flow-arrow {
      opacity: 0;
      transform-origin: top center;
    }
    .flow-header {
      opacity: 0;
    }
    .flow-cta-banner {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="70">
    <div class="bg-fill"></div>
    <div class="cinematic-vignette"></div>

    <audio id="narration" class="clip" data-start="0" data-duration="70" data-track-index="0" src="assets/narration.mp3"></audio>
    <audio id="bgm" class="clip" data-start="0" data-duration="70" data-track-index="1" src="assets/music-bg.mp3" data-volume="0.12" loop></audio>

    <!-- SFX Transition & Reveal Tracks -->
    <audio class="clip sfx" data-start="0.0" data-duration="0.8" data-track-index="2" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="11.66" data-duration="0.8" data-track-index="3" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="23.33" data-duration="0.8" data-track-index="4" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="34.99" data-duration="0.8" data-track-index="5" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="46.66" data-duration="0.8" data-track-index="6" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="58.32" data-duration="0.8" data-track-index="7" src="assets/sfx/whoosh-short.mp3" data-volume="0.22"></audio>
    <audio class="clip sfx" data-start="64.82" data-duration="1.2" data-track-index="8" src="assets/sfx/chime.mp3" data-volume="0.30"></audio>

    <!-- Scenes populated dynamically via template slots or materializer -->
    <main id="scenes-container"></main>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = window.gsap ? gsap.timeline({ paused: true }) : null;
    if (tl) {
      window.__timelines["main"] = tl;
      window.__hyperframes_timeline = tl;
    }

    window.__INIT_HYPERFRAMES_TEMPLATE__ = function(data) {
      if (!window.gsap) return;
      const activeTl = tl || gsap.timeline({ paused: true });
      window.__timelines["main"] = activeTl;
      window.__hyperframes_timeline = activeTl;

      // Master BGM Volume Fadeout
      const totalDur = data.duration || 70.0;
      tl.to("#bgm", { volume: 0, duration: 1.5, ease: "power2.in" }, Math.max(0, totalDur - 1.5));

      const scenes = data.scenes || [];
      scenes.forEach((scene, idx) => {
        const secId = `scene-${scene.id || idx}`;
        const startS = scene.start_s || 0.0;
        const endS = scene.end_s || totalDur;
        const dur = Math.max(0.5, endS - startS);
        const isFinal = (idx === scenes.length - 1);

        // Scene Visibility & Dynamic Section Momentum
        tl.set(`#${secId}`, { opacity: 1, pointerEvents: "auto" }, startS);
        tl.fromTo(`#${secId} .stage-card`,
          { opacity: 0, y: 35, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1.0, duration: 0.45, ease: "power2.out" },
          startS
        );

        // Continuous Subtle Ken Burns Drift
        tl.fromTo(`#${secId} .diagram-viewport`, 
          { scale: 1.0, y: 0 }, 
          { scale: 1.025, y: -6, duration: dur, ease: "none" }, 
          startS
        );

        // Step Timing Resolution (Domain Contract: min 2.0s - 4.0s hold before transition)
        const steps = scene.steps || [];
        const numSteps = steps.length;
        const holdTime = isFinal ? 5.0 : Math.min(4.0, Math.max(2.5, dur * 0.28));
        const usableSpan = Math.max(1.0, dur - holdTime);
        const stepInterval = (usableSpan - 0.2) / Math.max(1, numSteps - 1);

        tl.to(`#${secId} .flow-header`, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, startS + 0.1);

        steps.forEach((step, sIdx) => {
          const relT = isFinal 
            ? 0.2 + sIdx * (Math.min(5.5, dur * 0.48) - 0.2) / Math.max(1, numSteps - 1)
            : 0.2 + sIdx * stepInterval;
          const absT = startS + relT;

          tl.fromTo(`#${secId} #flow-step-${sIdx+1}`,
            { opacity: 0, y: 20, scale: 0.95 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" },
            absT
          );

          if (sIdx > 0) {
            tl.fromTo(`#${secId} #flow-arrow-${sIdx}`,
              { opacity: 0, scaleY: 0.5 },
              { opacity: 1, scaleY: 1, duration: 0.35, ease: "power2.out" },
              Math.max(startS + 0.1, absT - 0.3)
            );
          }
        });

        // CTA Banner & Climax Music Arc
        if (isFinal) {
          const ctaAbsT = startS + Math.min(dur - 1.5, Math.min(5.5, dur * 0.48) + 1.0);
          tl.to("#bgm", { volume: 0.16, duration: 0.8, ease: "power2.out" }, ctaAbsT);
          tl.fromTo(`#${secId} .flow-cta-banner`,
            { opacity: 0, y: 25, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
            ctaAbsT
          );
        } else if (idx === 2) {
          // Beat 3 Controversy / Mechanism: tension build & revelation duck
          tl.to("#bgm", { volume: 0.18, duration: 1.2, ease: "power2.in" }, startS);
          tl.to("#bgm", { volume: 0.06, duration: 0.6, ease: "power2.out" }, startS + 2.5);
        } else if (idx === 3) {
          // Beat 4 Remedy: resolution
          tl.to("#bgm", { volume: 0.13, duration: 0.8, ease: "power1.out" }, startS);
        }

        // Dynamic Scene Exit Transition
        if (!isFinal) {
          tl.to(`#${secId}`, { opacity: 0, y: -24, scale: 0.96, duration: 0.28, ease: "power2.in" }, Math.max(0, endS - 0.28));
        }
      });
    };
  </script>
</body>
</html>
